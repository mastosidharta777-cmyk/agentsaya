<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="100%" height="100%">
  <defs>
    <!-- Gradasi Warna untuk kata 'Saya' -->
    <linearGradient id="sayaGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />  <!-- Royal Blue -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Electric Cyan -->
    </linearGradient>
  </defs>

  <!-- Grup Teks -->
  <g font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif">
    <!-- Kata 'Agent' -->
    <text x="10" y="52" font-size="48" font-weight="900" fill="#0F172A" letter-spacing="-1.5">
      Agent
    </text>

    <!-- Kata 'Saya' (Di-indent sesuai keinginan Anda & dengan kontras warna) -->
    <text x="55" y="98" font-size="46" font-weight="700" fill="url(#sayaGradient)" letter-spacing="-1">
      Saya
    </text>
  </g>
</svg>
